{% extends "base.html" %}

{% block title %}{{ page_title|default:"Skill" }} | Job Portal{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h3 mb-3">
                    {{ page_title|default:"Skill" }}
                </h1>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary" type="submit">
                        {{ button_text|default:"Save" }}
                    </button>

                    <a class="btn btn-outline-secondary"
                       href="{% url 'Skill_list' %}">
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
